# One case per captured screen (M1). Expect is read from the visible screen,
# never from the rules. A capture whose rendered screen is blank has no frame
# to assert (the kit reads the byte-activity fallback there), so it is not a
# case. Screen names are flat `v312_`/`v313_`/`h3_`/`neg_` prefixes because
# the kit refuses `/` in `screen` names (`detect_check.rs:132-140`); the
# release prefix keeps 3.1.2 and 3.1.3 apart.

